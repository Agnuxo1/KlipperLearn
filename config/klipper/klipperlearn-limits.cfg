# KlipperLearn - hard acceleration cap for the Anycubic 4Max Pro (2026-09-26)
# Operator rule: above 2000 mm/s2 the carriage jumps and loses steps on direction
# changes. [printer] max_accel (1000) is only the startup value; slicer G-code can
# raise it at runtime with SET_VELOCITY_LIMIT or M204, so both are clamped here.
# To change the cap, edit variable_accel_cap and RESTART.

[gcode_macro SET_VELOCITY_LIMIT]
description: SET_VELOCITY_LIMIT with a hard acceleration cap (KlipperLearn)
rename_existing: _KL_SET_VELOCITY_LIMIT
variable_accel_cap: 2000.0
gcode:
  {% set args = [] %}
  {% for key, value in params.items() %}
    {% if key == 'ACCEL' %}
      {% set accel = value|float %}
      {% if accel > accel_cap %}
        {action_respond_info("KlipperLearn: ACCEL=%s limitada a %.0f mm/s2" % (value, accel_cap))}
        {% set accel = accel_cap %}
      {% endif %}
      {% set _ = args.append('ACCEL=%.1f' % accel) %}
    {% else %}
      {% set _ = args.append('%s=%s' % (key, value)) %}
    {% endif %}
  {% endfor %}
  _KL_SET_VELOCITY_LIMIT {args|join(' ')}

[gcode_macro M204]
description: M204 routed through the capped SET_VELOCITY_LIMIT (KlipperLearn)
rename_existing: M204.1
gcode:
  {% if 'S' in params %}
    {% set accel = params.S|float %}
  {% elif 'P' in params and 'T' in params %}
    {% set accel = [params.P|float, params.T|float]|min %}
  {% elif 'P' in params %}
    {% set accel = params.P|float %}
  {% elif 'T' in params %}
    {% set accel = params.T|float %}
  {% else %}
    {% set accel = 0.0 %}
  {% endif %}
  {% if accel > 0 %}
    SET_VELOCITY_LIMIT ACCEL={accel}
  {% endif %}
