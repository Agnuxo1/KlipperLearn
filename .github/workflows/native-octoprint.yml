name: Native OctoPrint framework
on:
  push:
    paths:
      - 'integrations/octoprint/**'
      - 'tools/check_octoprint_native.py'
      - '.github/workflows/native-octoprint.yml'
  pull_request:
    paths:
      - 'integrations/octoprint/**'
      - 'tools/check_octoprint_native.py'
      - '.github/workflows/native-octoprint.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  framework:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install isolated framework and standalone plugin
        run: python -m pip install 'OctoPrint==1.11.8' ./integrations/octoprint/plugin
      - name: Verify native entry point and events without hardware
        run: python tools/check_octoprint_native.py
