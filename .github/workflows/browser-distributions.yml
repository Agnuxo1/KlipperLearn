name: Browser distributions
on:
  push:
    paths: ['integrations/browser/**', 'docs/slicer-review/**', '.github/workflows/browser-distributions.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install playwright pillow
      - run: python -m playwright install --with-deps chromium
      - run: node --test integrations/browser/tests/engine.test.mjs
      - run: python integrations/browser/tools/build_multiplatform.py
      - run: python integrations/browser/tools/test_pwa.py
      - name: Actual temporary Chrome extension installation
        run: |
          BROWSER=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          xvfb-run -a python integrations/browser/tools/native_smoke.py --chromium-path "$BROWSER"
