name: Offline validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install application and validation dependencies
        run: |
          python -m pip install -e ".[learning,dev,mcp]" build
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Validate source and package
        run: |
          python -m ruff check src tests --select E9,F
          python -m compileall -q src
          python tools/check_repository.py
          python tools/build_ecosystem_packages.py --check
          python -m pip wheel --no-deps --wheel-dir /tmp/klipperlearn-plugin-wheels integrations/packages/OctoPrint-KlipperLearnEvidence-0.1.1.zip
          python -m build
      - name: Application tests with outbound sockets blocked
        run: python tools/run_offline_tests.py
      - name: Read-only exporter tests against simulated endpoints
        run: python -m unittest discover -s tools/exporter/tests -v
      - name: Browser and JavaScript tests with simulated devices
        run: |
          node scripts/run-node-tests.cjs
          node --test tests/core.test.js
