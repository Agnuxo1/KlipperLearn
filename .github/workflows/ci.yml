name: Offline validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check repository and Python syntax
        run: |
          python tools/check_repository.py
          python -m compileall -q tools integrations tests
      - name: Exporter tests (simulated HTTP only)
        run: python -m unittest discover -s tools/exporter/tests -v
      - name: Slice manifest tests (temporary files only)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Advisory core tests and JavaScript syntax
        run: |
          node --test tests/core.test.js
          node --check reference/core.js
          node --check reference/app.js
          node --check reference/demo.js
