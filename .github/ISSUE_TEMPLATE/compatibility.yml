name: Compatibility and validation report
description: Record an actual import, integration or supervised print test without private data.
title: "[Compatibility] "
body:
  - type: markdown
    attributes:
      value: "Thank you for testing. Do not attach passwords, API keys, private certificates, account exports or unredacted printer workspaces. Distinguish simulated, native-application and physical results."
  - type: input
    id: integration
    attributes:
      label: Integration and exact versions
      placeholder: "Example: OrcaSlicer version, KlipperLearn release, operating system"
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: What did you actually test?
      options:
        - Local or simulated contract
        - Real application import or plugin lifecycle without a printer
        - Supervised physical printer test
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction and observed result
      description: Include expected behavior, exact steps, relevant checksums and sanitized error messages.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Relevant printer and benchmark identity
      description: For physical tests include brand/model, nozzle, material, benchmark hash, layer height/count, trial repetitions and whether a person reviewed original photos. Omit local addresses and identifiers that are not needed.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before posting
      options:
        - label: I have removed credentials, unrelated personal data and private certificates.
          required: true
        - label: I have not represented simulated data or an edited image as physical evidence.
          required: true
