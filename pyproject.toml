[build-system]
requires = ["setuptools>=78.1"]
build-backend = "setuptools.build_meta"

[project]
name = "klipperlearn"
version = "0.6.0"
description = "Phone companion, evidence-based calibration and bounded profile tuning for Klipper printers"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "COPYING", "LICENSES/*.txt"]
authors = [{name = "Francisco Angulo de Lafuente"}, {name = "KlipperLearn contributors"}]
keywords = ["klipper", "fdm", "computer-vision", "calibration", "3d-printing"]

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]
dashboard = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
vision = ["Pillow>=10.4", "numpy>=1.26", "opencv-python>=4.10"]
learning = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "Pillow>=10.4", "numpy>=1.26", "opencv-python>=4.10"]
training = ["torch>=2.10.0,<3", "torchvision>=0.25,<1", "Pillow>=10.4"]
dev = ["ruff>=0.6", "pytest>=8"]

[project.scripts]
klipperlearn = "klipperlearn.__main__:main"
klipperlearn-optimize = "klipperlearn.slicer_optimizer:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
klipperlearn = ["mobile_app/*", "static/*"]

[tool.ruff]
line-length = 100

[project.urls]
Repository = "https://github.com/Agnuxo1/KlipperLearn"
Documentation = "https://github.com/Agnuxo1/KlipperLearn/tree/main/docs"
Issues = "https://github.com/Agnuxo1/KlipperLearn/issues"
